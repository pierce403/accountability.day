<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Accountability Day</title>
  <desc id="description">January 21, every four years. Equal justice under law. A rainbow and golden sun above soft clouds.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1">
      <stop stop-color="#fff9ed"/>
      <stop offset="1" stop-color="#f5eedf"/>
    </linearGradient>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#e9f1e9"/>
      <stop offset="1" stop-color="#f6f4e9"/>
    </linearGradient>
    <clipPath id="canvas"><rect width="1200" height="630"/></clipPath>
  </defs>

  <g clip-path="url(#canvas)">
    <rect width="1200" height="630" fill="url(#paper)"/>
    <ellipse cx="1090" cy="391" rx="351" ry="338" fill="url(#sky)"/>

    <!-- A warm sun with twelve rounded rays. -->
    <g transform="translate(1034 151)">
      <circle r="83" fill="#ffedbf"/>
      <g stroke="#ecb444" stroke-width="7" stroke-linecap="round">
        <path d="M0-96v-15 M0 96v15 M96 0h15 M-96 0h-15"/>
        <path d="M0-96v-15 M0 96v15 M96 0h15 M-96 0h-15" transform="rotate(30)"/>
        <path d="M0-96v-15 M0 96v15 M96 0h15 M-96 0h-15" transform="rotate(60)"/>
      </g>
      <circle r="61" fill="#f6c453"/>
      <circle cx="-15" cy="-17" r="35" fill="#ffda76" opacity=".7"/>
    </g>

    <!-- Seven continuous bands, with the ends tucked into clouds. -->
    <g fill="none" stroke-width="28">
      <path d="M736 499a270 270 0 0 1 540 0" stroke="#df7667"/>
      <path d="M763 499a243 243 0 0 1 486 0" stroke="#eb9e59"/>
      <path d="M790 499a216 216 0 0 1 432 0" stroke="#efd071"/>
      <path d="M817 499a189 189 0 0 1 378 0" stroke="#91b897"/>
      <path d="M844 499a162 162 0 0 1 324 0" stroke="#7fb2c2"/>
      <path d="M871 499a135 135 0 0 1 270 0" stroke="#8399c1"/>
      <path d="M898 499a108 108 0 0 1 216 0" stroke="#b09bbc"/>
    </g>

    <path d="M687 541c0-23 18-41 41-41 2-34 30-61 65-61 29 0 54 19 62 45 7-5 16-8 26-8 26 0 47 21 47 47 25 0 45 20 45 45H687Z" fill="#e6e9dc"/>
    <path d="M675 528c0-23 18-41 41-41 2-34 30-61 65-61 29 0 54 19 62 45 7-5 16-8 26-8 26 0 47 21 47 47 25 0 45 20 45 45H675Z" fill="#fffdf5"/>
    <path d="M1038 551c0-22 18-40 40-40 6-33 34-57 68-57 25 0 47 13 59 33 8-4 17-6 27-6 33 0 59 26 59 59v90h-253Z" fill="#fffdf5"/>
    <path d="M722 630c58-57 137-81 215-60 94 26 167 24 263-9v69Z" fill="#e3e9d9"/>
    <path d="M875 630c91-43 195-51 325-17v17Z" fill="#d2ddcb"/>

    <g font-family="Arial, Helvetica, sans-serif" fill="#182320">
      <path d="M72 100h32" stroke="#a63b31" stroke-width="2"/>
      <text x="119" y="107" fill="#a63b31" font-size="19" font-weight="700" letter-spacing="2">JANUARY 21 · EVERY FOUR YEARS</text>
      <text x="66" y="255" font-size="96" font-weight="700" letter-spacing="-4">Accountability</text>
      <text x="66" y="359" font-size="112" font-weight="700" letter-spacing="-4">Day</text>
      <text x="72" y="427" font-size="29" fill="#526158">Equal justice under law.</text>
      <path d="M72 505h566" stroke="#182320" stroke-opacity=".18"/>
      <text x="72" y="556" font-size="23" font-weight="700">accountability.day</text>
      <path d="M610 548h26m-9-9 9 9-9 9" fill="none" stroke="#a63b31" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
